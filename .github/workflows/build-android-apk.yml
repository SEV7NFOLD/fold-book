name: Build FoldBook Android APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android-apk.yml
      - android/app/src/main/res/drawable/foldbook_launcher.xml
      - android/smoke-test.sh
  workflow_dispatch:
    inputs:
      app_version:
        description: App version (for example 1.0.0)
        required: true
        default: "1.0.5"
        type: string
      app_version_code:
        description: Increasing integer for each APK release
        required: true
        default: "6"
        type: string
      release_tag:
        description: New GitHub release tag (for example android-v1.0.0)
        required: true
        default: "android-v1.0.5"
        type: string

permissions:
  contents: write

concurrency:
  group: foldbook-android-apk
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15-intel
    steps:
      - name: Check out FoldBook
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release inputs
        env:
          APP_VERSION: ${{ inputs.app_version || '1.0.5' }}
          APP_VERSION_CODE: ${{ inputs.app_version_code || '6' }}
          RELEASE_TAG: ${{ inputs.release_tag || 'android-v1.0.5' }}
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Confirm signing key is configured
        env:
          KEYSTORE_B64: ${{ secrets.FOLDBOOK_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOLDBOOK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing FOLDBOOK_ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing FOLDBOOK_ANDROID_KEYSTORE_PASSWORD"; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.FOLDBOOK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os

          with open("android/foldbook-release.jks", "wb") as keystore:
              keystore.write(base64.b64decode(os.environ["KEYSTORE_B64"], validate=True))
          PY
          chmod 600 android/foldbook-release.jks

      - name: Publish TWA domain verification
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FOLDBOOK_ANDROID_KEYSTORE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fingerprint="$(keytool -exportcert -keystore android/foldbook-release.jks -alias foldbook -storepass "$KEYSTORE_PASSWORD" -file /tmp/foldbook-cert.der >/dev/null 2>&1 && openssl x509 -inform DER -in /tmp/foldbook-cert.der -noout -fingerprint -sha256 | cut -d= -f2)"
          test -n "$fingerprint" || { echo "Could not read signing certificate fingerprint"; exit 1; }
          mkdir -p .well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.sev7nfold.foldbook","sha256_cert_fingerprints":["%s"]}}]\n' "$fingerprint" > .well-known/assetlinks.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish FoldBook Android app verification"
            git push origin HEAD:main
          fi
          for attempt in $(seq 1 36); do
            served="$(curl --silent --show-error --fail https://foldbook-beta.vercel.app/.well-known/assetlinks.json || true)"
            if printf '%s' "$served" | grep -Fq "$fingerprint"; then
              echo "FoldBook domain verification is live."
              exit 0
            fi
            sleep 10
          done
          echo "Vercel did not serve the app verification file in time."
          exit 1

      - name: Build signed release APK
        env:
          APP_VERSION: ${{ inputs.app_version || '1.0.5' }}
          APP_VERSION_CODE: ${{ inputs.app_version_code || '6' }}
          ANDROID_KEYSTORE_PATH: ../foldbook-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLDBOOK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk foldbook.apk

      - name: Launch APK on a clean Android emulator
        id: emulator_smoke
        timeout-minutes: 5
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          emulator-boot-timeout: 240
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android/smoke-test.sh

      - name: Report emulator verification result
        if: steps.emulator_smoke.outcome != 'success'
        run: echo "::warning::Emulator verification did not complete. A launch-test failure blocks release; emulator startup failure does not."

      - name: Publish signed APK release
        if: steps.emulator_smoke.outputs.smoke_result == 'passed' || (steps.emulator_smoke.outcome == 'failure' && steps.emulator_smoke.outputs.smoke_result == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ inputs.app_version || '1.0.5' }}
          RELEASE_TAG: ${{ inputs.release_tag || 'android-v1.0.5' }}
        run: |
          gh release create "$RELEASE_TAG" foldbook.apk --title "FoldBook Android $APP_VERSION" --notes "Direct-install Android APK for FoldBook. Download foldbook.apk and install it on Android."

      - name: Keep a workflow artifact copy
        if: always() && hashFiles('foldbook.apk') != ''
        uses: actions/upload-artifact@v6
        with:
          name: foldbook-android-${{ inputs.app_version || '1.0.5' }}
          path: foldbook.apk
          retention-days: 30
