name: Keep FoldBook Render demo awake

on:
  schedule:
    # Offset from the hour because GitHub notes that top-of-hour schedules
    # are more likely to be delayed.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: foldbook-render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Request the FoldBook health endpoint
        shell: bash
        run: |
          for attempt in {1..8}; do
            response="$(curl --silent --show-error --max-time 15 https://fold-book.onrender.com/ || true)"
            if [[ "$response" == "FoldBook WhatsApp Worker Active" ]]; then
              echo "FoldBook health endpoint responded."
              exit 0
            fi
            echo "Health endpoint is waking up (attempt $attempt/8)."
            sleep 10
          done
          echo "FoldBook health endpoint did not become ready." >&2
          exit 1
